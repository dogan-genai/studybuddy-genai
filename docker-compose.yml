services:
  chroma:
    image: chromadb/chroma:latest
    container_name: studybuddy-chroma
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - "${CHROMA_DATA_DIR:-./chroma-data}:/chroma/chroma"

  haystack:
    build:
      context: ./studybuddy-haystack
      dockerfile: Dockerfile
    container_name: studybuddy-haystack
    environment:
      - CHROMA_URL=http://chroma:8000
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-studybuddy_elektrotechnik}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_URL=http://host.docker.internal:11434
    ports:
      - "${HAYSTACK_PORT:-8010}:8010"
    depends_on:
      - chroma
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 15
  flowise:
    image: flowiseai/flowise:latest
    container_name: studybuddy-flowise
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
    volumes:
      - ./data/flowise:/root/.flowise
    depends_on:
      - backend

  crewai:
    build:
      context: ./studybuddy-crewai
      dockerfile: Dockerfile
    container_name: studybuddy-crewai
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "${CREWAI_PORT:-8011}:8011"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8011/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./studybuddy-backend
      dockerfile: Dockerfile
    container_name: studybuddy-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - HAYSTACK_URL=http://haystack:8010
      - CREWAI_URL=http://crewai:8011
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_URL=http://host.docker.internal:11434
      - NODE_ENV=production
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      haystack:
        condition: service_healthy
      crewai:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./artifacts:/data/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3001/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 15
  n8n:
    image: n8nio/n8n:latest
    container_name: studybuddy-n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path
      - NODE_FUNCTION_ALLOW_EXTERNAL=
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_EDITOR_BASE_URL=http://localhost:${N8N_PORT:-5678}
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5678}
      - GENERIC_TIMEZONE=Europe/Berlin
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data,/data/pdf_inbox,/data/artifacts,/home/node/.n8n
      - N8N_ALLOWED_FILE_PATHS=/data,/data/pdf_inbox,/data/artifacts,/home/node/.n8n
      - N8N_FILESYSTEM_ALLOWED_PATHS=/data,/data/pdf_inbox,/data/artifacts,/home/node/.n8n
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true    
    volumes:
      - "${N8N_DATA_DIR:-./n8n-files}:/home/node/.n8n"
      - ./pdf_inbox:/data/pdf_inbox
      - ./artifacts:/data/artifacts
      - ./data:/data



  crewai-service:
    build:
      context: ./crewai-service
    container_name: studybuddy-crewai-service
    ports:
      - "8012:8012"
    environment:
      - HAYSTACK_URL=http://haystack:8010
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - haystack
    networks:
      - default

  db-service:
    build:
      context: ./db-service
    container_name: studybuddy-db
    ports:
      - "8013:8013"
    volumes:
      - ./data:/data
    networks:
      - default
